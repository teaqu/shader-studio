name: Verify

# The gates, defined once. Both the push/PR workflow and the release workflow
# call this, so a tag can never be published against fewer checks than a commit
# had to pass. The split by runner is not arbitrary: WebGPU pixel readback needs
# a real GPU, which the Linux runners do not have.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Unit and extension tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same script the build uses, so the binary under test and the one
      # that ships are fetched and verified by one mechanism.
      - name: Install pinned Slang WASM binary
        run: node ui/scripts/ensure-slang-wasm.mjs

      - name: Build workspace test dependencies
        run: npm run build:deps -w extension

      - name: Run workspace Vitest suite
        run: npm test

      - name: Run UI type check
        run: npm run check -w ui

      - name: Run extension tests
        run: xvfb-run -a npm test -w extension

  rendering-e2e:
    name: Rendering browser E2E
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same script the build uses, so the binary under test and the one
      # that ships are fetched and verified by one mechanism.
      - name: Install pinned Slang WASM binary
        run: node ui/scripts/ensure-slang-wasm.mjs

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Build rendering test dependencies
        run: npm run build:deps -w extension

      - name: Run rendering browser E2E tests
        run: npm run test:e2e -w rendering

      - name: Run shader fixture corpus E2E tests
        run: npm run test:e2e:corpus -w rendering

  vscode-e2e:
    name: VS Code webview E2E
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same script the build uses, so the binary under test and the one
      # that ships are fetched and verified by one mechanism.
      - name: Install pinned Slang WASM binary
        run: node ui/scripts/ensure-slang-wasm.mjs

      - name: Build workspace test dependencies
        run: npm run build:deps -w extension

      # The suite drives VS Code's own Electron through _electron.launch(), but
      # the Slang dedup spec also opens the browser-connected UI in Chromium.
      # It needs the full build: the headless shell's only WebGPU adapter is
      # SwiftShader, which reports 16 textures and presents black.
      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run full VS Code webview E2E suite
        id: vscode-e2e
        run: npm run test:e2e:vscode -w extension

      - name: Upload VS Code webview E2E traces
        if: ${{ failure() && steps.vscode-e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: vscode-webview-e2e-failures
          path: extension/.playwright/
          if-no-files-found: ignore
          retention-days: 7
