name: Verify

# The gates, defined once. Both the push/PR workflow and the release workflow
# call this, so a tag can never be published against fewer checks than a commit
# had to pass. The split by runner is not arbitrary: WebGPU pixel readback needs
# a real GPU, which the Linux runners do not have.

on:
  workflow_call:
    outputs:
      version:
        description: Version of the tested extension
        value: ${{ jobs.package.outputs.version }}
      vsix_path:
        description: Filename of the tested VSIX artifact
        value: ${{ jobs.package.outputs.vsix_path }}

permissions:
  contents: read

jobs:
  # Asks Turbo which E2E suites a pull request affects (see
  # .github/scripts/select-e2e.mjs). Shadow mode: every suite still runs, and
  # the step summary records what would have been selected.
  select:
    name: E2E selection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # A pull request checks out GitHub's merge commit; Turbo compares it
      # with its first parent, the base it was merged onto.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Select E2E suites for the change
        run: node .github/scripts/select-e2e.mjs

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      vsix_path: ${{ steps.meta.outputs.vsix_path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read artifact metadata
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./extension/package.json').version")"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "vsix_path=shader-studio-${VERSION}.vsix" >> "${GITHUB_OUTPUT}"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build workspace dependencies
        run: npm run build:deps -w extension

      - name: Package VSIX
        working-directory: extension
        run: npx --yes @vscode/vsce package --no-dependencies --out "../${{ steps.meta.outputs.vsix_path }}"

      # --no-dependencies ships no node_modules, so a module left external in
      # the bundle resolves in the development host and nowhere else. That is
      # how 1.1.0 published a dead script bundler. Check the artifact itself.
      - name: Verify the VSIX carries what it needs at runtime
        run: node extension/scripts/verify-vsix.mjs "${{ steps.meta.outputs.vsix_path }}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: shader-studio-${{ steps.meta.outputs.version }}-vsix
          path: ${{ steps.meta.outputs.vsix_path }}
          if-no-files-found: error

  test:
    name: Unit and extension tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same script the build uses, so the binary under test and the one
      # that ships are fetched and verified by one mechanism.
      - name: Install pinned Slang WASM binary
        run: node ui/scripts/ensure-slang-wasm.mjs

      - name: Build workspace test dependencies
        run: npm run build:deps -w extension

      - name: Verify E2E test discovery
        run: node .github/scripts/e2e-inventory.mjs e2e-inventory.json

      - name: Upload E2E test inventory
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-inventory
          path: e2e-inventory.json
          if-no-files-found: error
          retention-days: 14

      - name: Run workspace Vitest suite
        run: npm test

      - name: Run UI type check
        run: npm run check -w ui

      - name: Run CI helper contract tests
        run: node --test standalone/e2e/*.test.mjs extension/e2e/pw/*.test.mjs extension/e2e/pw/bridge-extension/*.test.mjs .github/scripts/*.test.mjs

      - name: Run Open VSX publishing-script regression tests
        run: bash .github/scripts/test-publish-open-vsx.sh

      - name: Run extension tests
        run: xvfb-run -a npm test -w extension

  rendering-e2e:
    name: Rendering browser E2E
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same script the build uses, so the binary under test and the one
      # that ships are fetched and verified by one mechanism.
      - name: Install pinned Slang WASM binary
        run: node ui/scripts/ensure-slang-wasm.mjs

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Build rendering test dependencies
        run: npm run build:deps -w extension

      - name: Run rendering browser E2E tests
        run: npm run test:e2e -w rendering

      - name: Run shader fixture corpus E2E tests
        run: npm run test:e2e:corpus -w rendering

      - name: Run UI transport corpus E2E tests
        run: npm run test:e2e -w ui

  standalone-e2e:
    name: Standalone browser E2E
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Slang WASM binary
        run: node ui/scripts/ensure-slang-wasm.mjs

      - name: Build workspace test dependencies
        run: npm run build:deps -w extension

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox

      - name: Configure isolated standalone E2E ports
        run: |
          PORT_SEED=$((GITHUB_RUN_ID + GITHUB_RUN_ATTEMPT * 7919))
          echo "STANDALONE_E2E_PORT=$((20000 + PORT_SEED % 10000))" >> "${GITHUB_ENV}"
          echo "STANDALONE_E2E_DEV_PORT=$((30000 + PORT_SEED % 10000))" >> "${GITHUB_ENV}"

      - name: Run all standalone browser projects
        id: standalone-e2e
        run: npm run test:e2e -w @shader-studio/standalone

      - name: Upload standalone E2E results
        if: ${{ failure() && steps.standalone-e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: standalone-e2e-failures
          path: standalone/test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  vscode-e2e:
    name: Installed VSIX E2E (GPU)
    runs-on: macos-15
    needs: package
    timeout-minutes: 45
    env:
      SHADER_STUDIO_E2E_TIMINGS_FILE: ${{ github.workspace }}/extension/e2e-timings.jsonl
      PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/extension/e2e-results.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Download tested extension artifact
        uses: actions/download-artifact@v8
        with:
          name: shader-studio-${{ needs.package.outputs.version }}-vsix

      # The connected-browser spec needs Chromium with a real WebGPU adapter.
      - name: Install Playwright browser
        run: npx playwright install chromium

      # This rig covers extension-host-only corpus contracts (workspace @/
      # resolution, scripts, model geometry and Slang imports). It needs the
      # source workspace rather than the packaged extension, so retain it next
      # to the installed-VSIX pass instead of conflating the two hosts.
      - name: Run extension-host corpus E2E tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/extension/corpus-e2e-results.json
        run: npm run test:e2e:vscode:corpus -w extension

      # These selections are complementary: every spec runs once, using the
      # same archive that a release publishes. No development build is loaded.
      - name: Run installed-VSIX E2E tests
        id: vsix-e2e
        env:
          SHADER_STUDIO_E2E_VSIX: ${{ github.workspace }}/${{ needs.package.outputs.vsix_path }}
          SHADER_STUDIO_E2E_GREP: '@gpu'
          # Override the runner's default GPU exclusion for this selection.
          SHADER_STUDIO_E2E_GREP_INVERT: '(?!)'
          # A runner opens the workbench at whatever size it defaults to, and the
          # preview collapses controls and splits editor groups by the width it
          # gets. Pin a desktop-sized window so layout is the same every run.
          SHADER_STUDIO_E2E_WINDOW: '1600x1000'
        run: /usr/bin/time -l -o extension/e2e-resources.txt npm run test:e2e:vsix -w extension

      - name: Upload installed-VSIX E2E traces
        if: ${{ failure() && steps.vsix-e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: packaged-vsix-e2e-GPU-failures
          path: extension/.playwright/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload VS Code E2E measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: vscode-e2e-GPU-measurements
          path: |
            extension/e2e-timings.jsonl
            extension/e2e-results.json
            extension/e2e-resources.txt
            extension/corpus-e2e-results.json
          if-no-files-found: ignore
          retention-days: 14

  vscode-e2e-linux:
    name: Installed VSIX E2E (no GPU)
    runs-on: ubuntu-latest
    needs: package
    timeout-minutes: 45
    env:
      SHADER_STUDIO_E2E_TIMINGS_FILE: ${{ github.workspace }}/extension/e2e-timings.jsonl
      PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/extension/e2e-results.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install test dependencies
        run: npm ci

      # websocket-origin.e2e.mjs launches a separate Chromium browser to test
      # the origin accepted by the installed extension's web server.
      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Download tested extension artifact
        uses: actions/download-artifact@v8
        with:
          name: shader-studio-${{ needs.package.outputs.version }}-vsix

      # These selections are complementary: every spec runs once, using the
      # same archive that a release publishes. No development build is loaded.
      - name: Run installed-VSIX E2E tests
        id: vsix-e2e
        env:
          SHADER_STUDIO_E2E_VSIX: ${{ github.workspace }}/${{ needs.package.outputs.vsix_path }}
          SHADER_STUDIO_E2E_GREP_INVERT: '@gpu'
          SHADER_STUDIO_E2E_WINDOW: '1600x1000'
        # The virtual display has to be larger than the window it hosts.
        run: /usr/bin/time -v -o extension/e2e-resources.txt xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run test:e2e:vsix -w extension

      - name: Upload installed-VSIX E2E traces
        if: ${{ failure() && steps.vsix-e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: packaged-vsix-e2e-no-GPU-failures
          path: extension/.playwright/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload VS Code E2E measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: vscode-e2e-no-GPU-measurements
          path: |
            extension/e2e-timings.jsonl
            extension/e2e-results.json
            extension/e2e-resources.txt
          if-no-files-found: ignore
          retention-days: 14

  # Run deliberate shutdown wedges on separate runners, alongside installed
  # tests. They must not add their 15-second graceful bound to the GPU lane.
  cleanup-e2e:
    name: Controlled Electron cleanup (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            time-flags: '-l'
            display: ''
          - os: ubuntu-latest
            time-flags: '-v'
            display: 'xvfb-run -a --server-args="-screen 0 1920x1080x24"'
    env:
      SHADER_STUDIO_E2E_TIMINGS_FILE: ${{ github.workspace }}/extension/e2e-timings.jsonl
      SHADER_STUDIO_E2E_VSIX: ${{ github.workspace }}/${{ needs.package.outputs.vsix_path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Download tested extension artifact
        uses: actions/download-artifact@v8
        with:
          name: shader-studio-${{ needs.package.outputs.version }}-vsix

      - name: Validate controlled live Electron cleanup
        run: /usr/bin/time ${{ matrix.time-flags }} -o extension/cleanup-resources.txt ${{ matrix.display }} npm run test:e2e:vscode:cleanup:live -w extension

      - name: Upload controlled cleanup measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: controlled-cleanup-${{ matrix.os }}-measurements
          path: |
            extension/e2e-timings.jsonl
            extension/cleanup-resources.txt
          if-no-files-found: error
          retention-days: 14

  # One verdict for the run, for branch protection: it fails if any job
  # failed, was cancelled or was skipped. Once selection is enforced, the
  # jobs it omits are passed in allowed-skips.
  result:
    name: Verification result
    if: ${{ always() }}
    needs: [select, package, test, rendering-e2e, standalone-e2e, vscode-e2e, vscode-e2e-linux, cleanup-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check every job verified the change
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
