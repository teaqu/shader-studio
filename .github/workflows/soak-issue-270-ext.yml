name: Soak issue 270 (extension mocha)

# Temporary: separate branch so re-running this does not cancel the rendering soak.
on:
  push:
    branches:
      - claude/issue-270-soak-ext

permissions:
  contents: read

jobs:
  extension-tests:
    name: Extension mocha suite (real VS Code) x2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node ui/scripts/ensure-slang-wasm.mjs
      - run: npm run build:deps -w extension
      - name: Run extension tests
        shell: bash
        run: |
          set +e
          fails=0
          for i in 1 2; do
            xvfb-run -a npm test -w extension > "ext-$i.log" 2>&1
            rc=$?
            echo "run $i exit $rc, log lines $(wc -l < "ext-$i.log")"
            echo "::notice title=ext sentinel $i::exit $rc lines $(wc -l < "ext-$i.log")"
            # Short, individually escaped annotations: the long ones did not appear.
            n=0
            while IFS= read -r line && [ $n -lt 6 ]; do
              line="${line//'%'/'%25'}"
              echo "::error title=ext run $i line $n::${line:0:1500}"
              n=$((n+1))
            done < <(sed 's/\x1b\[[0-9;]*m//g' "ext-$i.log" | grep -E "failing|^\s+[0-9]+\) |Error|rror:|expected|actual" | head -6)
            tailtxt="$(sed 's/\x1b\[[0-9;]*m//g' "ext-$i.log" | grep -v '^npm error' | tail -40)"
            tailtxt="${tailtxt//'%'/'%25'}"; tailtxt="${tailtxt//$'\r'/}"; tailtxt="${tailtxt//$'\n'/'%0A'}"
            echo "::warning title=ext run $i tail::${tailtxt:0:6000}"
            [ "$rc" -ne 0 ] && fails=$((fails+1))
          done
          [ "$fails" -eq 0 ]
