name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'ui/**'
      - 'standalone/**'
      - 'shader-explorer/**'
      - 'rendering/**'
      - 'types/**'
      - 'debug/**'
      - 'monaco/**'
      - 'language-servers/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
      - '.github/scripts/assemble-pages.sh'
      - '.github/scripts/publish-pages.mjs'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The site is served from the gh-pages branch so pull request previews
# (pr-preview.yml) can live beside it under pr-preview/.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install docs deps
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Install node dependencies
        run: npm ci

      - name: Build docs
        run: mkdocs build --strict

      - name: Build web app
        run: npm run build:standalone

      - name: Assemble combined Pages output
        run: bash .github/scripts/assemble-pages.sh

      - name: Publish to the gh-pages branch
        # Replaces the live site and keeps every pull request preview.
        run: node .github/scripts/publish-pages.mjs --source public --keep pr-preview
