name: PR Preview

# Opt-in previews: a pull request is deployed to
# https://<owner>.github.io/<repo>/pr-preview/pr-<number>/ only while it carries
# the `preview` label. Removing the label or closing the pull request removes
# the preview. Preview builds keep their browser storage apart from the live
# app on the same origin (standalone/src/previewIsolation.ts).

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, closed]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PREVIEW_DIR: pr-preview/pr-${{ github.event.pull_request.number }}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    # Forks never get a preview: their code would run with a token that can
    # write to this repository's Pages branch.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.action != 'closed'
      && github.event.action != 'unlabeled'
      && contains(github.event.pull_request.labels.*.name, 'preview')
      && (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install docs deps
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Install node dependencies
        run: npm ci

      - name: Build docs
        run: mkdocs build --strict

      - name: Build web app
        run: npm run build:standalone
        env:
          VITE_PREVIEW_CHANNEL: pr-${{ github.event.pull_request.number }}

      - name: Assemble combined Pages output
        run: bash .github/scripts/assemble-pages.sh

      - name: Publish the preview
        run: node .github/scripts/publish-pages.mjs --source public --target "$PREVIEW_DIR"

      - name: Link the preview
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const url = `https://${owner.toLowerCase()}.github.io/${repo}/${process.env.PREVIEW_DIR}/`;
            const body = [
              '<!-- pr-preview -->',
              `**Preview:** [app](${url}app/) · [docs](${url}docs/)`,
              '',
              `Built from ${context.payload.pull_request.head.sha.slice(0, 7)}. Pages can take a minute to update.`,
              'Previews keep their own saved workspace, so your real one is untouched. Remove the `preview` label to take it down.',
            ].join('\n');
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.startsWith('<!-- pr-preview -->'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  remove:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action == 'closed'
        || (github.event.action == 'unlabeled' && github.event.label.name == 'preview'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Remove the preview
        run: node .github/scripts/publish-pages.mjs --remove --target "$PREVIEW_DIR"

      - name: Mark the preview removed
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.startsWith('<!-- pr-preview -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id,
                body: '<!-- pr-preview -->\n**Preview removed.** Add the `preview` label to deploy it again.',
              });
            }
