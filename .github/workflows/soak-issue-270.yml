name: Soak issue 270

# Temporary, soak branch only: repeats the shader fixture corpus, whose
# readback timeouts #270 has not yet explained, with a separate-process GPU
# canary to tell host-wide GPU stalls from work this engine queued.
on:
  push:
    branches:
      - claude/issue-270-soak
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soak-issue-270-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  corpus:
    name: WebGPU probe + canary, corpus x${{ matrix.runs }} (${{ matrix.shard }})
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b]
        runs: [6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node ui/scripts/ensure-slang-wasm.mjs
      - run: npx playwright install chromium
      - run: npm run build:deps -w extension

      - name: WebGPU adapter and readback round-trip
        shell: bash
        run: |
          node soak/webgpu-probe.mjs > webgpu-probe.log 2>&1
          rc=$?
          body="$(sysctl -n machdep.cpu.brand_string) probe exit $rc"$'\n'"$(cat webgpu-probe.log)"
          body="${body//'%'/'%25'}"; body="${body//$'\n'/'%0A'}"
          echo "::notice title=shard ${{ matrix.shard }} WebGPU probe::$body"

      - name: Corpus soak with canary
        shell: bash
        run: |
          set +e
          mkdir -p soak-logs
          node soak/canary.mjs soak-logs/canary.log > soak-logs/canary.out 2>&1 &
          canary=$!
          sleep 5
          fails=0; table=""
          for i in $(seq 1 ${{ matrix.runs }}); do
            log="soak-logs/corpus-$i.log"
            start=$SECONDS
            npm run test:e2e:corpus -w rendering > "$log" 2>&1
            rc=$?
            t=$(grep -c "Timed out waiting for canvas pixel readback" "$log")
            table+="run $i exit $rc $((SECONDS-start))s readback-timeouts $t"$'\n'
            node soak/annotate.mjs "$log" "shard ${{ matrix.shard }} corpus run $i" "$rc" soak-logs/canary.log
            [ "$rc" -ne 0 ] && fails=$((fails+1))
          done
          kill "$canary"
          canarySummary="$(grep -c '^spike' soak-logs/canary.log) spikes; $(tail -2 soak-logs/canary.log | tr '\n' ' ') $(tail -3 soak-logs/canary.out | tr '\n' ' ')"
          body="$table"$'\n'"canary: $canarySummary"
          body="${body//'%'/'%25'}"; body="${body//$'\n'/'%0A'}"
          echo "::notice title=shard ${{ matrix.shard }} corpus table failed runs $fails::$body"
          [ "$fails" -eq 0 ]
