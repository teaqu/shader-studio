name: Soak issue 270

# Temporary, soak branch only: repeats the shader fixture corpus, whose
# readback timeouts #270 has not yet explained, with a separate-process GPU
# canary to tell host-wide GPU stalls from work this engine queued.
on:
  push:
    branches:
      - claude/issue-270-soak
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soak-issue-270-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  corpus:
    name: Real adapter - UI x3, rendering + corpus x${{ matrix.runs }} (${{ matrix.shard }})
    runs-on: macos-15
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b]
        runs: [5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node ui/scripts/ensure-slang-wasm.mjs
      - run: npx playwright install chromium
      - run: npm run build:deps -w extension

      - name: WebGPU adapter and readback round-trip
        shell: bash
        run: |
          node soak/webgpu-probe.mjs > webgpu-probe.log 2>&1
          rc=$?
          body="$(sysctl -n machdep.cpu.brand_string) probe exit $rc"$'\n'"$(cat webgpu-probe.log)"
          body="${body//'%'/'%25'}"; body="${body//$'\n'/'%0A'}"
          echo "::notice title=shard ${{ matrix.shard }} WebGPU probe::$body"

      - name: GPU suites on the real adapter
        shell: bash
        run: |
          set +e
          mkdir -p soak-logs
          fails=0; table=""
          run_suite() {
            local i="$1" ws="$2" script="$3"
            local log="soak-logs/${ws}-${script//:/-}-${i}.log"
            local start=$SECONDS
            npm run "$script" -w "$ws" > "$log" 2>&1
            local rc=$?
            local t=$(grep -c "Timed out waiting for canvas pixel readback" "$log")
            local g=$(grep -c "the harness did not request" "$log")
            local adapter=$(grep -m1 -o "\[soak\] adapter.*" "$log" | sed 's/\[soak\] adapter //')
            local tests=$(sed 's/\x1b\[[0-9;]*m//g' "$log" | grep -E "^\s+Tests\s" | tail -1 | tr -s ' ')
            table+="$i $ws $script exit $rc $((SECONDS-start))s timeouts $t frame-guard $g |$tests | $adapter"$'\n'
            # Annotation budget per step: notices for corpus runs, errors for failures.
            if [ "$script" = "test:e2e:corpus" ]; then
              node soak/annotate.mjs "$log" "shard ${{ matrix.shard }} $ws $script run $i" "$rc"
            elif [ "$rc" -ne 0 ]; then
              node soak/annotate.mjs "$log" "shard ${{ matrix.shard }} $ws $script run $i" "$rc" | grep '^::error'
            fi
            [ "$rc" -ne 0 ] && fails=$((fails+1))
          }
          for i in 1 2 3; do run_suite "$i" ui test:e2e; done
          for i in $(seq 1 ${{ matrix.runs }}); do
            run_suite "$i" rendering test:e2e
            run_suite "$i" rendering test:e2e:corpus
          done
          body="${table//'%'/'%25'}"; body="${body//$'\n'/'%0A'}"
          echo "::notice title=shard ${{ matrix.shard }} real-adapter table failed runs $fails::$body"
          [ "$fails" -eq 0 ]
