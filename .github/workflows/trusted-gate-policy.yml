name: Trusted gate policy

# This workflow inspects API metadata only. It never checks out or executes PR
# code, installs PR dependencies, downloads PR artifacts or reads PR scripts.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pull_request:
        description: PR number to recheck after owner review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: trusted-policy-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request }}
  cancel-in-progress: false

jobs:
  policy:
    name: Evaluate trusted CI policy
    if: ${{ (github.event_name != 'issue_comment' || github.event.issue.pull_request) && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This environment must permit only main; PR workflows cannot obtain its key.
    environment: trusted-gates
    steps:
      - name: Checkout trusted policy only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Test trusted policy
        run: node --test .github/scripts/trusted-gate-policy.test.mjs
      - name: Create isolated policy publisher token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.TRUSTED_GATE_APP_ID }}
          private-key: ${{ secrets.TRUSTED_GATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-statuses: write
          permission-pull-requests: read
      - name: Evaluate PR metadata and publish its commit status
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const { checkPullRequest } = await import(pathToFileURL(resolve('.github/scripts/trusted-gate-policy.mjs')).href);
            const value = context.payload.pull_request?.number ?? context.payload.issue?.number ?? context.payload.inputs?.pull_request;
            if (!/^[1-9][0-9]*$/.test(String(value)) || !Number.isSafeInteger(Number(value))) {
              throw new Error('Invalid pull request number');
            }
            await checkPullRequest({ github, context, core, number: Number(value) });
