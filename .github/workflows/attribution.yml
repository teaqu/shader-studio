name: Attribution

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: No AI tool attribution
    runs-on: ubuntu-latest
    steps:
      # Run the checker as it is on the base branch, never the PR's copy: a
      # branch cut before the checker existed has no copy at all, and a PR that
      # edited it could otherwise pass its own check with a weakened version.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      # The PR's commits are only data to scan. refs/pull/N/head also exists for
      # PRs from forks, whose branches are not in this repository.
      - name: Fetch the PR's commits
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"

      - name: Test the checker
        run: node --test .githooks/check-attribution.test.mjs

      # The branch name reaches the script through the environment, never the shell.
      - name: Check commits and branch name
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: node .githooks/check-attribution.mjs --range "$RANGE" --branch "$BRANCH"
