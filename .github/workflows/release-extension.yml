name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_open_vsx:
        description: 'Publish the packaged extension to Open VSX'
        required: false
        default: false
        type: boolean
      allow_existing_version:
        description: 'Release a version a registry already carries (recovering a half-finished publish)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Read release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      vsix_path: ${{ steps.meta.outputs.vsix_path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # First, and on its own runner: a tag that does not match the version is
      # worth knowing in seconds rather than after the gates have run.
      - name: Read release metadata
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./extension/package.json').version")"
          VSIX_PATH="shader-studio-${VERSION}.vsix"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match extension version v${VERSION}." >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "vsix_path=${VSIX_PATH}" >> "${GITHUB_OUTPUT}"

      # A registry keys on the version, so `--skip-duplicate` turns a repeat
      # release into a green run that uploaded nothing: the tag moves and users
      # keep the old build. Refuse the version before anything is built.
      - name: Refuse a version the registries already carry
        env:
          ALLOW_EXISTING_VERSION: ${{ inputs.allow_existing_version || 'false' }}
        run: node extension/scripts/check-version-published.mjs

  # Package once and run the same installed-VSIX gates as push/PR CI. The
  # publishing jobs download that tested artifact without rebuilding it.
  verify:
    name: Verify
    needs: meta
    uses: ./.github/workflows/verify.yml

  publish-vscode:
    name: Publish VS Code Marketplace and GitHub Release
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    environment:
      name: extension-marketplaces
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: shader-studio-${{ needs.verify.outputs.version }}-vsix

      - name: Check publishing secret
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          test -n "${VSCE_PAT}" || (echo "Missing VSCE_PAT secret." >&2 && exit 1)

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath "${{ needs.verify.outputs.vsix_path }}" --skip-duplicate

      - name: Create checksum
        run: sha256sum "${{ needs.verify.outputs.vsix_path }}" > "${{ needs.verify.outputs.vsix_path }}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          VSIX_PATH: ${{ needs.verify.outputs.vsix_path }}
        run: |
          cat > release-notes.md <<EOF
          Shader Studio ${VERSION}

          Published to:
          - VS Code Marketplace

          Manual install:
          - Download the attached ${VSIX_PATH}
          - Run: code --install-extension ${VSIX_PATH}
          EOF

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${VSIX_PATH}" "${VSIX_PATH}.sha256" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${VSIX_PATH}" "${VSIX_PATH}.sha256" \
              --title "Shader Studio ${VERSION}" \
              --notes-file release-notes.md \
              --verify-tag
          fi

  publish-open-vsx:
    name: Publish Open VSX
    runs-on: ubuntu-latest
    needs: verify
    # A tag publishes to both registries, in parallel: the two jobs share only
    # the packaged VSIX, so an Open VSX outage cannot hold up or undo the
    # Marketplace release. It does turn the run red, which is the point - the
    # dispatch below then republishes this registry alone.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch' && inputs.publish_open_vsx)
    environment:
      name: extension-marketplaces
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: shader-studio-${{ needs.verify.outputs.version }}-vsix

      - name: Check Open VSX publishing secret
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: test -n "${OVSX_PAT}" || (echo "Missing OVSX_PAT secret." >&2 && exit 1)

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: bash .github/scripts/publish-open-vsx.sh "${{ needs.verify.outputs.vsix_path }}"
