name: Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Slang WASM test binary
        run: |
          curl -fsSL https://github.com/shader-slang/slang/releases/download/v2026.10.2/slang-2026.10.2-wasm.zip -o /tmp/slang-wasm.zip
          echo "bff18e4a0a0f1d377d4f8ac8bc0e9c631351f2e223a0482a279c1742f3d5bcc6  /tmp/slang-wasm.zip" | sha256sum --check
          unzip -j /tmp/slang-wasm.zip slang-wasm.wasm -d ui/src/slang

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build workspace test dependencies
        run: npm run build:deps -w extension

      - name: Run workspace Vitest suite
        run: npm test

      - name: Run extension tests
        run: xvfb-run -a npm test -w extension

  rendering-e2e:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Slang WASM test binary
        run: |
          curl -fsSL https://github.com/shader-slang/slang/releases/download/v2026.10.2/slang-2026.10.2-wasm.zip -o /tmp/slang-wasm.zip
          echo "bff18e4a0a0f1d377d4f8ac8bc0e9c631351f2e223a0482a279c1742f3d5bcc6  /tmp/slang-wasm.zip" | shasum -a 256 --check
          unzip -j /tmp/slang-wasm.zip slang-wasm.wasm -d ui/src/slang

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Build rendering test dependencies
        run: npm run build:deps -w extension

      - name: Run rendering browser E2E tests
        run: npm run test:e2e -w rendering

      - name: Run shader fixture corpus E2E tests
        run: npm run test:e2e:corpus -w rendering

  vscode-e2e:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Slang WASM test binary
        run: |
          curl -fsSL https://github.com/shader-slang/slang/releases/download/v2026.10.2/slang-2026.10.2-wasm.zip -o /tmp/slang-wasm.zip
          echo "bff18e4a0a0f1d377d4f8ac8bc0e9c631351f2e223a0482a279c1742f3d5bcc6  /tmp/slang-wasm.zip" | shasum -a 256 --check
          unzip -j /tmp/slang-wasm.zip slang-wasm.wasm -d ui/src/slang

      - name: Run full VS Code webview E2E suite
        id: vscode-e2e
        run: npm run test:e2e:vscode -w extension

      - name: Upload VS Code webview E2E failure screenshots
        if: ${{ failure() && steps.vscode-e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: vscode-webview-e2e-failures
          path: extension/.wdio/
          if-no-files-found: ignore
          retention-days: 7
