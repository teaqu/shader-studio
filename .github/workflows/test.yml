name: Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "mkdocs.yml"
  pull_request:
    # Labels must not create a new Test check for an unchanged commit.
    # ci:full is read on the next update; dispatch Test for a full run now.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || (startsWith(github.ref, 'refs/tags/') && format('tag-{0}-run-{1}', github.ref_name, github.run_id) || format('branch-{0}', github.ref_name)) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
