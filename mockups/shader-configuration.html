#shader-file-first .sf-overlay{position:absolute;inset:0;z-index:4;padding:48px 16px 16px;background:light-dark(#00000024,#00000066);border-radius:6px}
#shader-file-first .sf-dialog{background:var(--sf-header);border:1px solid var(--sf-border);border-radius:5px;padding:16px;box-shadow:0 8px 26px #0003}
#shader-file-first .sf-dialog-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
#shader-file-first .sf-dialog-heading h3{margin:0}
#shader-file-first .sf-dialog-heading button{min-width:32px;padding:0;font-size:20px}
#shader-file-first .sf-picker-label{color:var(--sf-muted);font-size:11px;margin:0 0 6px}
#shader-file-first .sf-file-list{display:flex;flex-direction:column;gap:4px}
#shader-file-first .sf-file-list button{text-align:left;overflow-wrap:anywhere}
#shader-file-first .sf-picker-actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--sf-border);padding-top:12px;margin-top:12px}
#shader-file-first .sf-new-form{display:flex;flex-direction:column;gap:12px}
#shader-file-first .sf-new-form .sf-picker-actions{margin-top:0;border:0;padding:0;justify-content:flex-end}
#shader-file-first .sf-status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#shader-file-first .sf-code{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sf-input);color:var(--sf-text);padding:10px;border-radius:3px;font:12px/1.5 Consolas,monospace;margin:8px 0 0}
#shader-file-first .sf-added,#shader-file-first .sf-camera-default{font-size:12px;color:var(--sf-muted);margin-top:6px;align-items:center}
#shader-file-first .sf-channel-row{flex-wrap:nowrap;padding:8px;border:1px solid var(--sf-border);border-radius:4px}
#shader-file-first .sf-thumbnail{width:58px;height:48px;flex-shrink:0;border-radius:3px;background:var(--sf-input);object-fit:cover}
#shader-file-first .sf-channel-info{flex:1;min-width:0;overflow-wrap:anywhere}
#shader-file-first .sf-channel-info small{display:block;color:var(--sf-muted);font-size:11px}
#shader-file-first .sf-channel-actions{display:flex;gap:4px;flex-wrap:wrap}
#shader-file-first .sf-channel-actions{max-width:128px;justify-content:flex-end}
#shader-file-first .sf-panel .sf-channel-actions button{padding:4px;min-height:28px;font-size:11px}
#shader-file-first .sf-panel .sf-preview-button{padding:0;border:0;line-height:0}
#shader-file-first .sf-panel .sf-channel-actions button{border:0;display:inline-flex;align-items:center;justify-content:center}
#shader-file-first .sf-channel-preview-large{width:100%;height:100px;object-fit:cover}
@media(max-width:420px){#shader-file-first .sf-stage{padding:12px 0}#shader-file-first .sf-content{padding-left:12px;padding-right:12px}#shader-file-first .sf-function-row{flex-wrap:wrap}#shader-file-first .sf-function-row select{flex-basis:100%}#shader-file-first .sf-overlay{padding:38px 8px 8px}#shader-file-first .sf-channel-actions{max-width:70px}#shader-file-first .sf-channel-info{min-width:70px}#shader-file-first .sf-channel-row{flex-wrap:wrap}}
