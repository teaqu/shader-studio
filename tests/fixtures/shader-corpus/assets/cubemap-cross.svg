<svg xmlns="http://www.w3.org/2000/svg" width="512" height="384" viewBox="0 0 512 384">
  <rect width="512" height="384" fill="#1b1d24"/>

  <!-- T-cross cubemap layout consumed by CubemapTextureManager:
       +Y above +Z, -Y below +Z, -X/+Z/+X/-Z across the middle row. -->
  <rect x="256" y="128" width="128" height="128" fill="#ff2020"/>
  <rect x="0" y="128" width="128" height="128" fill="#00c85a"/>
  <rect x="128" y="0" width="128" height="128" fill="#205cff"/>
  <rect x="128" y="256" width="128" height="128" fill="#ffd21f"/>
  <rect x="128" y="128" width="128" height="128" fill="#ff35d2"/>
  <rect x="384" y="128" width="128" height="128" fill="#20dfff"/>

  <g fill="none" stroke="#ffffff" stroke-width="6" opacity="0.92">
    <rect x="262" y="134" width="116" height="116"/>
    <rect x="6" y="134" width="116" height="116"/>
    <rect x="134" y="6" width="116" height="116"/>
    <rect x="134" y="262" width="116" height="116"/>
    <rect x="134" y="134" width="116" height="116"/>
    <rect x="390" y="134" width="116" height="116"/>
  </g>

  <g font-family="Menlo, Consolas, monospace" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
    <text x="320" y="192">+X</text>
    <text x="64" y="192">-X</text>
    <text x="192" y="64">+Y</text>
    <text x="192" y="320">-Y</text>
    <text x="192" y="192">+Z</text>
    <text x="448" y="192">-Z</text>
  </g>
</svg>
